name: Refresh public SEO dashboard

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Write Google Search Console credentials
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gsc-service-account.json"
      - name: Refresh actual GSC metrics
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gsc-service-account.json
          GSC_SITE_URL: sc-domain:dawnwalker.cc
        run: npm run seo:check
      - name: Commit refreshed public data when it changed
        run: |
          git add public/seo-dashboard-data.json
          git diff --cached --quiet || git commit -m "Refresh public SEO dashboard data"
          git push
