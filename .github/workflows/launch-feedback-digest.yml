name: Launch feedback digest

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a daily triage digest after launch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%Y-%m-%d)" \< "2026-09-03" ]; then exit 0; fi
          gh label create player-feedback --repo "$REPO" --color "B60205" --description "Player-submitted report" 2>/dev/null || true
          gh label create needs-triage --repo "$REPO" --color "FBCA04" --description "Needs verification and response" 2>/dev/null || true
          DATE=$(date -u +%F)
          COUNT=$(gh issue list --repo "$REPO" --label player-feedback --state open --search "created:>=$DATE" --json number --jq 'length')
          node scripts/community-pulse.mjs > "$RUNNER_TEMP/community.md"
          printf "## %s new direct player reports\n\n" "$COUNT" > "$RUNNER_TEMP/digest.md"
          cat "$RUNNER_TEMP/community.md" >> "$RUNNER_TEMP/digest.md"
          printf "\n## Editorial response\n\n- [ ] Group duplicates\n- [ ] Record platform, game version and reproducible steps\n- [ ] Check official known-issues channels\n- [ ] Reproduce or label as unverified\n- [ ] Add a dated fix or workaround to the relevant guide\n" >> "$RUNNER_TEMP/digest.md"
          NUMBER=$(gh issue list --repo "$REPO" --state open --search "in:title \"Launch feedback digest — $DATE\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/digest.md"
          else
            gh issue create --repo "$REPO" --label needs-triage --title "Launch feedback digest — $DATE" --body-file "$RUNNER_TEMP/digest.md"
          fi
