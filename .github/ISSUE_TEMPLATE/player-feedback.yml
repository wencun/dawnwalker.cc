name: Player feedback or issue
description: Report a launch issue, missing guide detail or reproducible workaround.
title: "[Feedback]: "
labels: ["player-feedback", "needs-triage"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Crash or technical issue, Performance, Quest or progression, Platform/store, Missing guide detail, Other]
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [PC, PlayStation 5, Xbox Series X, Xbox Series S, Other]
    validations: { required: true }
  - type: textarea
    id: version
    attributes: { label: Game version and settings, description: "Include game version, graphics/performance mode and relevant settings." }
  - type: textarea
    id: steps
    attributes: { label: What happened and how to reproduce it?, description: "Please use numbered steps where possible." }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: "Screenshots, video, error message or a public community link. Please do not share personal data." }
